name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ship only the live site: the design-canvas leftovers and the unused
      # flipbook frames stay out of the deploy
      - name: Assemble site
        run: |
          mkdir -p _site/assets _site/bloom-frames
          cp index.html journal.html shop.html about.html _site/
          cp assets/bloom-hero.mp4 assets/bloom-hero.webm _site/assets/
          cp bloom-frames/f_18.jpg _site/bloom-frames/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
