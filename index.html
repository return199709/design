<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herbal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Italiana&family=Manrope:wght@500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: 0.55; }

  .scroll-stage {
    position: relative;
    height: 250vh;
  }

  .hero {
    position: sticky;
    top: 0;
    width: 100vw;
    height: 100vh;
    background-color: oklch(84% 0.045 55);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    color: oklch(23% 0.03 40);
  }

  .hero video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-color: oklch(84% 0.045 55 / 0.22);
    z-index: 1;
    pointer-events: none;
  }

  .nav {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 40px 48px 0 48px;
  }

  .logo {
    font-family: 'Italiana', serif;
    font-size: 20px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .links {
    display: flex;
    gap: 48px;
  }

  .links a {
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .headline {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: flex-start;
    align-items: baseline;
    width: 100%;
    margin: 0;
    padding: 0 48px;
    color: oklch(30% 0.16 24);
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    font-size: min(24vw, 38vh);
    line-height: 1;
    white-space: nowrap;
    text-transform: uppercase;
  }

  .headline span {
    display: inline-block;
  }

  .pillars-row {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 64px;
    padding: 0 48px 40px 48px;
  }

  .pillar h2 {
    margin: 0 0 16px 0;
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    font-size: clamp(22px, 2.4vw, 32px);
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: oklch(30% 0.16 24);
  }

  .pillar p {
    margin: 0;
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    /* darker than the old cream section: this copy now sits over the footage */
    color: oklch(32% 0.025 45);
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="dissolve-0" x="-100%" y="-100%" width="300%" height="300%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2" result="noise"/>
      <feDisplacementMap id="disp-0" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feGaussianBlur id="blur-0" in="warped" stdDeviation="0"/>
    </filter>
    <filter id="dissolve-1" x="-100%" y="-100%" width="300%" height="300%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap id="disp-1" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feGaussianBlur id="blur-1" in="warped" stdDeviation="0"/>
    </filter>
    <filter id="pillar-0" x="-100%" y="-100%" width="300%" height="300%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap id="disp-p0" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feGaussianBlur id="blur-p0" in="warped" stdDeviation="0"/>
    </filter>
    <filter id="pillar-1" x="-100%" y="-100%" width="300%" height="300%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap id="disp-p1" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feGaussianBlur id="blur-p1" in="warped" stdDeviation="0"/>
    </filter>
    <filter id="pillar-2" x="-100%" y="-100%" width="300%" height="300%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="31" result="noise"/>
      <feDisplacementMap id="disp-p2" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feGaussianBlur id="blur-p2" in="warped" stdDeviation="0"/>
    </filter>
  </defs>
</svg>

<div class="scroll-stage">
  <div class="hero">
    <video autoplay muted loop playsinline preload="auto" poster="bloom-frames/f_18.jpg">
      <source src="assets/bloom-hero.webm" type="video/webm">
      <source src="assets/bloom-hero.mp4" type="video/mp4">
    </video>

    <nav class="nav">
      <div class="logo">Herbal</div>
      <div class="links">
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="journal.html">Journal</a>
      </div>
    </nav>

    <h1 class="headline" aria-label="Qi">
      <span style="filter: url(#dissolve-0)">Q</span><span style="filter: url(#dissolve-1)">i</span>
    </h1>

    <div class="pillars-row">
      <div class="pillar">
        <h2 style="filter: url(#pillar-0)">Longevity</h2>
        <p>Time-honored formulas that support the body's natural rhythm, season after season.</p>
      </div>
      <div class="pillar">
        <h2 style="filter: url(#pillar-1)">Nourish</h2>
        <p>Whole-root botanicals selected to restore balance from the inside out.</p>
      </div>
      <div class="pillar">
        <h2 style="filter: url(#pillar-2)">Replenish</h2>
        <p>Daily rituals that rebuild what modern life quietly depletes.</p>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var video = document.querySelector('.hero video');

  if (reduceMotion && video) {
    video.removeAttribute('autoplay');
    video.pause();
  }

  if (reduceMotion) return;

  var letters = Array.prototype.slice.call(document.querySelectorAll('.headline span'));
  var dispEls = letters.map(function (_, i) { return document.getElementById('disp-' + i); });
  var blurEls = letters.map(function (_, i) { return document.getElementById('blur-' + i); });
  var duration = 0.4;
  var n = letters.length;
  var stagger = n > 1 ? (1 - duration) / (n - 1) : 0;

  var pillars = Array.prototype.slice.call(document.querySelectorAll('.pillar'));
  var pDisp = pillars.map(function (_, i) { return document.getElementById('disp-p' + i); });
  var pBlur = pillars.map(function (_, i) { return document.getElementById('blur-p' + i); });
  var pDuration = 0.6;
  var pStagger = pillars.length > 1 ? (1 - pDuration) / (pillars.length - 1) : 0;

  var stage = document.querySelector('.scroll-stage');
  var hero = document.querySelector('.hero');
  var ticking = false;

  function clamp(v) { return Math.min(1, Math.max(0, v)); }

  function update() {
    // one progress through the pinned range: Qi clears first, then the row
    var pin = Math.max(1, stage.offsetHeight - hero.offsetHeight);
    var p = clamp(window.scrollY / pin);

    var qp = clamp(p / 0.5);
    letters.forEach(function (el, i) {
      var li = clamp((qp - i * stagger) / duration);
      if (dispEls[i]) dispEls[i].setAttribute('scale', String(li * 70));
      if (blurEls[i]) blurEls[i].setAttribute('stdDeviation', String((li * 3).toFixed(2)));
      el.style.opacity = String(1 - li);
    });

    // overlaps the tail of Qi so one hands off to the next
    var pp = clamp((p - 0.42) / 0.58);
    pillars.forEach(function (el, i) {
      var li = clamp((pp - i * pStagger) / pDuration);
      if (pDisp[i]) pDisp[i].setAttribute('scale', String(li * 70));
      if (pBlur[i]) pBlur[i].setAttribute('stdDeviation', String((li * 3).toFixed(2)));
      el.style.opacity = String(1 - li);
    });

    ticking = false;
  }

  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  update();
})();
</script>
</body>
</html>
