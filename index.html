<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herbal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Italiana&family=Manrope:wght@500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: 0.55; }

  .scroll-stage {
    position: relative;
    height: 200vh;
  }

  .hero {
    position: sticky;
    top: 0;
    width: 100vw;
    height: 100vh;
    background-color: oklch(84% 0.045 55);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    color: oklch(23% 0.03 40);
  }

  .hero video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-color: oklch(84% 0.045 55 / 0.22);
    z-index: 1;
    pointer-events: none;
  }

  .nav {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 40px 48px 0 48px;
  }

  .logo {
    font-family: 'Italiana', serif;
    font-size: 20px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .links {
    display: flex;
    gap: 48px;
  }

  .links a {
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .headline {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: 100%;
    margin: 0;
    padding: 0 0 40px 0;
    color: oklch(30% 0.16 24);
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    font-size: 13vw;
    line-height: 1;
    white-space: nowrap;
    text-transform: uppercase;
  }

  .headline span {
    display: inline-block;
  }
</style>
</head>
<body>

<div class="scroll-stage">
  <div class="hero">
    <video autoplay muted loop playsinline preload="auto" poster="bloom-frames/f_18.jpg">
      <source src="assets/bloom-hero.webm" type="video/webm">
      <source src="assets/bloom-hero.mp4" type="video/mp4">
    </video>

    <nav class="nav">
      <div class="logo">Herbal</div>
      <div class="links">
        <a href="#">Shop</a>
        <a href="#">Rituals</a>
        <a href="#">About</a>
        <a href="#">Journal</a>
      </div>
    </nav>

    <h1 class="headline" aria-label="Herbal">
      <span>H</span><span>e</span><span>r</span><span>b</span><span>a</span><span>l</span>
    </h1>
  </div>
</div>

<script>
(function () {
  var letters = Array.prototype.slice.call(document.querySelectorAll('.headline span'));
  var video = document.querySelector('.hero video');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduceMotion && video) {
    video.removeAttribute('autoplay');
    video.pause();
  }

  if (!letters.length || reduceMotion) return;

  var duration = 0.4;
  var n = letters.length;
  var stagger = n > 1 ? (1 - duration) / (n - 1) : 0;
  var ticking = false;

  function update() {
    var vh = window.innerHeight || 1;
    var p = Math.min(1, Math.max(0, window.scrollY / vh));
    letters.forEach(function (el, i) {
      var li = Math.min(1, Math.max(0, (p - i * stagger) / duration));
      var fall = li * li * 140;
      var scaleX = 1 + li * 0.08;
      var scaleY = 1 - li * 0.12;
      el.style.transform = 'translateY(' + fall + 'px) scale(' + scaleX + ', ' + scaleY + ')';
      el.style.opacity = String(1 - li);
    });
    ticking = false;
  }

  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  update();
})();
</script>
</body>
</html>
