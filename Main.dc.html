<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Italiana&family=Manrope:wght@500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.55; }

    .scroll-stage {
      position: relative;
      height: 200vh;
    }

    .hero {
      position: sticky;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: oklch(84% 0.045 55);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      color: oklch(23% 0.03 40);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 40px 48px 0 48px;
    }

    .logo {
      font-family: 'Italiana', serif;
      font-size: 20px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .links {
      display: flex;
      gap: 48px;
    }

    .links a {
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .headline {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      margin: 0;
      padding: 0 0 40px 0;
      color: oklch(30% 0.16 24);
      font-family: 'Archivo Black', sans-serif;
      font-weight: 400;
      font-size: 13vw;
      line-height: 1;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .headline span {
      display: inline-block;
    }
  </style>
</helmet>

<div class="scroll-stage">
  <div class="hero">
    <nav class="nav">
      <div class="logo">Herbal</div>
      <div class="links">
        <a href="#">Shop</a>
        <a href="#">Rituals</a>
        <a href="#">About</a>
        <a href="#">Journal</a>
      </div>
    </nav>

    <h1 class="headline" aria-label="Herbal">
      <span>H</span><span>e</span><span>r</span><span>b</span><span>a</span><span>l</span>
    </h1>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    this.letters = Array.from(document.querySelectorAll('.headline span'));
    if (!this.letters.length || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const duration = 0.4;
    const n = this.letters.length;
    const stagger = n > 1 ? (1 - duration) / (n - 1) : 0;
    let ticking = false;

    const update = () => {
      const vh = window.innerHeight || 1;
      const p = Math.min(1, Math.max(0, window.scrollY / vh));
      this.letters.forEach((el, i) => {
        const li = Math.min(1, Math.max(0, (p - i * stagger) / duration));
        const fall = li * li * 140;
        const scaleX = 1 + li * 0.08;
        const scaleY = 1 - li * 0.12;
        el.style.transform = `translateY(${fall}px) scale(${scaleX}, ${scaleY})`;
        el.style.opacity = String(1 - li);
      });
      ticking = false;
    };

    this.onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    };

    window.addEventListener('scroll', this.onScroll, { passive: true });
    update();
  }

  componentWillUnmount() {
    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);
  }

  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
