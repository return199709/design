<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.55; }

    .hero {
      width: 100vw;
      height: 100vh;
      background: oklch(84% 0.045 55);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      color: oklch(23% 0.03 40);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 40px 48px 0 48px;
    }

    .logo {
      font-family: 'Italiana', serif;
      font-size: 20px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .links {
      display: flex;
      gap: 48px;
    }

    .links a {
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .headline {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      margin: 0;
      padding: 0 0 40px 0;
      font-family: 'Italiana', serif;
      font-weight: 400;
      font-size: 13vw;
      line-height: 1;
      white-space: nowrap;
    }

    .headline span {
      display: inline-block;
    }
  </style>
</helmet>

<div class="hero">
  <nav class="nav">
    <div class="logo">Herbal</div>
    <div class="links">
      <a href="#">Shop</a>
      <a href="#">Rituals</a>
      <a href="#">About</a>
      <a href="#">Journal</a>
    </div>
  </nav>

  <h1 class="headline" aria-label="Herbal">
    <span>H</span><span>e</span><span>r</span><span>b</span><span>a</span><span>l</span>
  </h1>
</div>
</x-dc>
</body>
</html>
