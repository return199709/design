<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Italiana&family=Manrope:wght@500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.55; }

    .scroll-stage {
      position: relative;
      height: 200vh;
    }

    .hero {
      position: sticky;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: oklch(84% 0.045 55);
      background-image: url(./f_01.jpg);
      background-size: cover;
      background-position: center;
      animation: bloom-flip 16s linear infinite;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      color: oklch(23% 0.03 40);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: oklch(84% 0.045 55 / 0.22);
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero {
        animation: none;
        background-image: url(./f_18.jpg);
      }
    }

    </h1>

</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    this.letters = Array.from(document.querySelectorAll('.headline span'));
    if (!this.letters.length || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const duration = 0.4;
    const n = this.letters.length;
    const stagger = n > 1 ? (1 - duration) / (n - 1) : 0;
    let ticking = false;

    const update = () => {
      const vh = window.innerHeight || 1;
      const p = Math.min(1, Math.max(0, window.scrollY / vh));
      this.letters.forEach((el, i) => {
        const li = Math.min(1, Math.max(0, (p - i * stagger) / duration));
        const fall = li * li * 140;
        const scaleX = 1 + li * 0.08;
        const scaleY = 1 - li * 0.12;
        el.style.transform = `translateY(${fall}px) scale(${scaleX}, ${scaleY})`;
        el.style.opacity = String(1 - li);
      });
      ticking = false;
    };

    this.onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    };

    window.addEventListener('scroll', this.onScroll, { passive: true });
    update();
  }

  componentWillUnmount() {
    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);
  }

  renderVals() {
    return {};
  }
}
</script>
